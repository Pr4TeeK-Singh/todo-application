<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; }
        .task-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #007bff;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .priority-high { border-left-color: #dc3545 !important; }
        .priority-medium { border-left-color: #ffc107 !important; }
        .priority-low { border-left-color: #28a745 !important; }
        .stats-card {
            border-radius: 10px;
            padding: 20px;
            color: white;
        }
        .stats-pending { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stats-progress { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .stats-completed { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-tasks"></i> Todo Application
            </span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="fas fa-user-circle"></i> <span th:text="${username}"></span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stats-card stats-pending text-center">
                    <h2 id="pendingCount">0</h2>
                    <p class="mb-0">Pending Tasks</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card stats-progress text-center">
                    <h2 id="progressCount">0</h2>
                    <p class="mb-0">In Progress</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card stats-completed text-center">
                    <h2 id="completedCount">0</h2>
                    <p class="mb-0">Completed</p>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="clearForm()">
                    <i class="fas fa-plus"></i> Add New Task
                </button>
                <div class="btn-group ms-2" role="group">
                    <button class="btn btn-outline-secondary" onclick="filterTasks('ALL')">All</button>
                    <button class="btn btn-outline-warning" onclick="filterTasks('PENDING')">Pending</button>
                    <button class="btn btn-outline-info" onclick="filterTasks('IN_PROGRESS')">In Progress</button>
                    <button class="btn btn-outline-success" onclick="filterTasks('COMPLETED')">Completed</button>
                </div>
            </div>
        </div>

        <div class="row" id="tasksContainer">
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="taskStatus">
                                <option value="PENDING">Pending</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="taskPriority">
                                <option value="LOW">Low</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="HIGH">High</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Due Date</label>
                            <input type="datetime-local" class="form-control" id="taskDueDate">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveTask()">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentFilter = 'ALL';
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            loadStats();
        });

        function loadTasks() {
            fetch('/api/tasks')
                .then(response => response.json())
                .then(tasks => {
                    displayTasks(tasks);
                })
                .catch(error => console.error('Error loading tasks:', error));
        }

        function loadStats() {
            fetch('/api/tasks/stats')
                .then(response => response.json())
                .then(stats => {
                    document.getElementById('pendingCount').textContent = stats.pending;
                    document.getElementById('progressCount').textContent = stats.inProgress;
                    document.getElementById('completedCount').textContent = stats.completed;
                })
                .catch(error => console.error('Error loading stats:', error));
        }

        function displayTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            let filteredTasks = tasks;
            if (currentFilter !== 'ALL') {
                filteredTasks = tasks.filter(task => task.status === currentFilter);
            }
            if (filteredTasks.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="alert alert-info">No tasks found</div></div>';
                return;
            }
            filteredTasks.forEach(task => {
                const priorityClass = `priority-${task.priority.toLowerCase()}`;
                const statusBadge = getStatusBadge(task.status);
                const priorityBadge = getPriorityBadge(task.priority);
                const taskCard = `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card task-card ${priorityClass}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title mb-0">${task.title}</h5>
                                    <div>
                                        ${statusBadge}
                                    </div>
                                </div>
                                <p class="card-text text-muted">${task.description || 'No description'}</p>
                                <div class="mb-2">
                                    ${priorityBadge}
                                    ${task.dueDate ? `<span class="badge bg-secondary"><i class="far fa-calendar"></i> ${formatDate(task.dueDate)}</span>` : ''}
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <button class="btn btn-sm btn-outline-primary" onclick="editTask(${task.id})">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += taskCard;
            });
        }

        function getStatusBadge(status) {
            const badges = {
                'PENDING': '<span class="badge bg-warning text-dark">Pending</span>',
                'IN_PROGRESS': '<span class="badge bg-info">In Progress</span>',
                'COMPLETED': '<span class="badge bg-success">Completed</span>'
            };
            return badges[status] || '';
        }

        function getPriorityBadge(priority) {
            const badges = {
                'LOW': '<span class="badge bg-success"><i class="fas fa-arrow-down"></i> Low</span>',
                'MEDIUM': '<span class="badge bg-warning text-dark"><i class="fas fa-minus"></i> Medium</span>',
                'HIGH': '<span class="badge bg-danger"><i class="fas fa-arrow-up"></i> High</span>'
            };
            return badges[priority] || '';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function filterTasks(status) {
            currentFilter = status;
            loadTasks();
        }

        function clearForm() {
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Task';
        }

        function editTask(id) {
            fetch(`/api/tasks/${id}`)
                .then(response => response.json())
                .then(task => {
                    document.getElementById('taskId').value = task.id;
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('taskStatus').value = task.status;
                    document.getElementById('taskPriority').value = task.priority;
                    if (task.dueDate) {
                        const date = new Date(task.dueDate);
                        const formattedDate = date.toISOString().slice(0, 16);
                        document.getElementById('taskDueDate').value = formattedDate;
                    }
                    document.getElementById('modalTitle').textContent = 'Edit Task';
                    new bootstrap.Modal(document.getElementById('taskModal')).show();
                })
                .catch(error => console.error('Error loading task:', error));
        }

        function saveTask() {
            const id = document.getElementById('taskId').value;
            const task = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value,
                dueDate: document.getElementById('taskDueDate').value || null
            };
            const url = id ? `/api/tasks/${id}` : '/api/tasks';
            const method = id ? 'PUT' : 'POST';
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(task)
            })
            .then(response => response.json())
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
                loadTasks();
                loadStats();
            })
            .catch(error => console.error('Error saving task:', error));
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                fetch(`/api/tasks/${id}`, {
                    method: 'DELETE'
                })
                .then(() => {
                    loadTasks();
                    loadStats();
                })
                .catch(error => console.error('Error deleting task:', error));
            }
        }
    </script>
</body>
</html>
